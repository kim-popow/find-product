<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Product Finder - Find the product that you own"
    />
    <link rel="apple-touch-icon" href="/HDG.AS-904908b0.png" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Product Finder</title>

    <!--
      Zendesk Conversation Extension: official Webview SDK.
      https://developer.zendesk.com/documentation/conversations/messaging-platform/programmable-conversations/conversation-extensions/

      `webviewSdkInit` is called by the SDK once it has finished its handshake
      with the container (Web Widget / iOS / Android). The app waits on
      `window.__webviewSdkReady`; it resolves with `null` if the script cannot
      be loaded, so the page keeps working outside Zendesk.
    -->
    <script>
      window.__webviewSdkReady = new Promise(function (resolve) {
        window.webviewSdkInit = function (sdk) {
          resolve(sdk);
        };
        window.__webviewSdkFailed = function () {
          resolve(null);
        };
      });
    </script>
    <script
      async
      src="https://static.zdassets.com/conversation-extensions/latest/sdk.js"
      onerror="window.__webviewSdkFailed()"
    ></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
